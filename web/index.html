<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic Similarity UI</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Arial;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        width: 100%;
        height: 80px;
      }
      input,
      button {
        padding: 0.5rem;
      }
      .result {
        border-bottom: 1px solid #eee;
        padding: 0.5rem 0;
      }
      .score {
        color: #0a58ca;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Semantic Similarity Demo</h1>
    <p>Enter a query and optionally load the sample corpus, then search.</p>

    <label>Query</label>
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Semantic Similarity UI</title>
        <link rel="stylesheet" href="/static/style.css" />
      </head>
      <body>
        <div class="container">
          <div class="card">
            <h1>Semantic Similarity</h1>
            <p class="lead">
              Try a query against the sample corpus. The results are paginated
              and sorted by score.
            </p>

            <label for="query">Query</label>
            <textarea id="query">
Artificial intelligence is transforming many industries.</textarea
            >

            <div class="controls">
              <div class="meta">
                <label for="page_size">Page size</label>
                <input id="page_size" type="number" value="5" min="1" />
              </div>
              <div
                style="
                  margin-left: auto;
                  display: flex;
                  gap: 0.5rem;
                  align-items: center;
                "
              >
                <button id="prev" disabled>&larr; Prev</button>
                <input
                  id="page"
                  type="number"
                  value="1"
                  min="1"
                  style="
                    width: 64px;
                    padding: 0.45rem;
                    border-radius: 8px;
                    border: 1px solid #e6e9ef;
                  "
                />
                <button id="next">Next &rarr;</button>
                <button id="search">Search</button>
              </div>
            </div>

            <div class="footer">Total results: <span id="total">0</span></div>

            <div id="results" class="results"></div>
          </div>
        </div>

        <script>
          const api = "/similarity/search";
          const elResults = document.getElementById("results");
          const elTotal = document.getElementById("total");
          const elQuery = document.getElementById("query");
          const elPage = document.getElementById("page");
          const elPageSize = document.getElementById("page_size");
          const btnSearch = document.getElementById("search");
          const btnPrev = document.getElementById("prev");
          const btnNext = document.getElementById("next");

          async function doSearch(page) {
            btnSearch.disabled = true;
            btnPrev.disabled = true;
            btnNext.disabled = true;
            elResults.innerHTML = '<div class="result">Loading…</div>';
            const body = {
              query: elQuery.value,
              page: page,
              page_size: parseInt(elPageSize.value) || 5,
            };
            try {
              const resp = await fetch(api, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              });
              const data = await resp.json();
              renderResults(data);
            } catch (e) {
              elResults.innerHTML = `<div class="result">Error: ${e.message}</div>`;
            } finally {
              btnSearch.disabled = false;
              updatePagerButtons();
            }
          }

          function renderResults(data) {
            elResults.innerHTML = "";
            elTotal.textContent = data.total ?? 0;
            if (!data.results || data.results.length === 0) {
              elResults.innerHTML = '<div class="result">No results</div>';
              return;
            }
            data.results.forEach((r) => {
              const d = document.createElement("div");
              d.className = "result";
              d.innerHTML = `<div><span class='score'>${r.score.toFixed(
                4
              )}</span></div><div style="clear:both;margin-top:0.25rem">${escapeHtml(
                r.text
              )}</div>`;
              elResults.appendChild(d);
            });
          }

          function updatePagerButtons() {
            const page = parseInt(elPage.value) || 1;
            const pageSize = parseInt(elPageSize.value) || 5;
            const total = parseInt(elTotal.textContent) || 0;
            const maxPage = Math.max(1, Math.ceil(total / pageSize));
            btnPrev.disabled = page <= 1;
            btnNext.disabled = page >= maxPage;
          }

          function escapeHtml(s) {
            return s
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;");
          }

          btnSearch.addEventListener("click", () => {
            elPage.value = 1;
            doSearch(1);
          });
          btnPrev.addEventListener("click", () => {
            const p = Math.max(1, (parseInt(elPage.value) || 1) - 1);
            elPage.value = p;
            doSearch(p);
          });
          btnNext.addEventListener("click", () => {
            const p = (parseInt(elPage.value) || 1) + 1;
            elPage.value = p;
            doSearch(p);
          });
          elPage.addEventListener("change", () => {
            const p = Math.max(1, parseInt(elPage.value) || 1);
            elPage.value = p;
            doSearch(p);
          });
          elPageSize.addEventListener("change", () => {
            elPage.value = 1;
            doSearch(1);
          });

          // initial load
          doSearch(1);
        </script>
      </body>
    </html>
  </body>
</html>
